<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Library Manager</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>

<body>
    <main>
        <div class="upperSection">
            <div>
                <button type="button" id="addBtn">add book</button>
            </div>
            <div>
                <input type="text" id="searchInp" placeholder="Search your Book">
            </div>
            <div>
                <label for="sort">Sort</label>
                <select name="sort" id="sortBook">
                    <option value="normal" selected >all</option>
                    <option value="a-to-z">A to Z</option>
                    <option value="z-to-a">Z to A</option>
                </select>
            </div>
        </div>
        <form hidden  id="myForm">
            <div>
                <label for="image">image</label>
                <input type="file" id="imageInp">
            </div>
            <div>
                <label for="title">Title</label>
                <input type="text" placeholder="Book title" id="titleInp">
            </div>
            <div>
                <label for="status">Status</label>
                <input type="text" placeholder="Book Status" id="statusInp">
            </div>
            <div>
                <button id="editBtn" type="button">edit</button>
                <button id="deleteBtn" type="button">delete</button>
                <button id="addBtn">add</button>
            </div>
        </form>
        <div id="lowerSection">

        </div>
        <span id="bookCounter"></span>
    </main>
    <!-- <script src="script.js"></script> -->
</body>

</html>
