<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Builder & Player</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>
    <main>
        <div class="container">
            <!-- BUILD QUIZ CARD -->
            <div class="card buildQuizContainer">
                <div class="card-header">
                    <h2>Build Quiz</h2>
                    <span id="questionCounter" class="badge">0 Questions Added</span>
                </div>

                <form id="myForm" class="buildQuizzContents">
                    <div class="form-group">
                        <label for="enterQuestion">Question</label>
                        <textarea name="question" id="enterQuestion" placeholder="Enter your question here..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Options</label>
                        <div class="options-grid">
                            <input type="text" class="inputOption" id="option1" placeholder="Option A">
                            <input type="text" class="inputOption" id="option2" placeholder="Option B">
                            <input type="text" class="inputOption" id="option3" placeholder="Option C">
                            <input type="text" class="inputOption" id="option4" placeholder="Option D">
                        </div>
                    </div>

                    <div class="form-group correctAnswer">
                        <label>Select Correct Answer</label>
                        <div class="radio-group">
                            <div class="correctOption">
                                <input type="radio" id="correctOption1" name="correctAnswer" value="1">
                                <label for="correctOption1" id="option1Label">Option 1</label>
                            </div>
                            <div class="correctOption">
                                <input type="radio" id="correctOption2" name="correctAnswer" value="2">
                                <label for="correctOption2" id="option2Label">Option 2</label>
                            </div>
                            <div class="correctOption">
                                <input type="radio" id="correctOption3" name="correctAnswer" value="3">
                                <label for="correctOption3" id="option3Label">Option 3</label>
                            </div>
                            <div class="correctOption">
                                <input type="radio" id="correctOption4" name="correctAnswer" value="4">
                                <label for="correctOption4" id="option4Label">Option 4</label>
                            </div>
                        </div>
                    </div>

                    <button type="button" id="addQuestionBtn" class="btn btn-primary">Add Question</button>
                </form>
            </div>

            <!-- PLAY QUIZ CARD -->
            <div class="card playQuizContainer">
                <div class="card-header">
                    <h2>Play Quiz</h2>
                    <button type="button" id="playQuizzBtn" class="btn btn-secondary">Start Quiz</button>
                </div>

                <div class="playQuizzContent">
                    <div id="displayQuestion" class="question-display">Click "Start Quiz" to begin</div>

                    <form id="playForm" class="radio-group">
                        <div class="quizOption">
                            <input type="radio" id="showOption1" name="choice" value="1">
                            <label for="showOption1" id="showOption1Label">Option A</label>
                        </div>
                        <div class="quizOption">
                            <input type="radio" id="showOption2" name="choice" value="2">
                            <label for="showOption2" id="showOption2Label">Option B</label>
                        </div>
                        <div class="quizOption">
                            <input type="radio" id="showOption3" name="choice" value="3">
                            <label for="showOption3" id="showOption3Label">Option C</label>
                        </div>
                        <div class="quizOption">
                            <input type="radio" id="showOption4" name="choice" value="4">
                            <label for="showOption4" id="showOption4Label">Option D</label>
                        </div>
                    </form>

                    <!-- STATS DASHBOARD -->
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span>Question:</span>
                            <span id="questionProgress">0/0</span>
                        </div>
                        <div class="stat-item">
                            <span>Correct:</span>
                            <span id="correctAnswer" class="text-success">0</span>
                        </div>
                        <div class="stat-item">
                            <span>Wrong:</span>
                            <span id="wrongAnswer" class="text-danger">0</span>
                        </div>
                        <div class="stat-item">
                            <span>Score:</span>
                            <span id="scoreprogress" class="text-accent">0%</span>
                        </div>
                    </div>

                    <div class="quizActions">
                        <button type="button" id="previousBtn" class="btn btn-outline">Previous</button>
                        <button type="button" id="nextBtn" class="btn btn-primary">Next</button>
                        <button type="button" id="showResultBtn" class="btn btn-success">Show Result</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="script2.js"></script>
</body>

</html>
