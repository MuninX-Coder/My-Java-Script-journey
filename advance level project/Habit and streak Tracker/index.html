<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit and streak Tracker</title>
</head>

<body>
    <main>
        <header>
            <div>
                <h1>Habit & Streak Tracker</h1>
                <p>We are what we repeatedly do. Excellence, then, is not an act, but a habit.</p>
            </div>
            <button id="addHabitBtn">Add Habit</button>
        </header>

        <section id="habitsSection">


        </section>

        <form id="myForm" hidden>
            <div>
                <label for="habitName">Habit</label>
                <input type="text" name="habitName" id="habitName">
            </div>
            <div>
                <button type="button" id="createHabitBtn">create</button>
                <button type="button" id="cancelHabitBtn">cancel</button>
            </div>
        </form>
    </main>
    <script src="script.js"></script>
</body>

</html>
