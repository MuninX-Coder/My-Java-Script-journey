<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        /* Modern UI Color Palette Variables */
        :root {
            --bg-main: #0b0f19;
            --card-bg: #131c2e;
            --card-inner: #0b0f19;
            --border-color: #222f47;
            --text-white: #f8fafc;
            --text-slate: #94a3b8;
            --accent-glow: #3b82f6;
            --accent-red: #ef4444;
            --font-system: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Base Page Layout Overhaul */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            font-family: var(--font-system);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* Master Grid Grid System */
        main {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
        }

        /* Main Dashboard Header */
        .game-heading {
            width: 100%;
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        /* Game Cards (User and Computer Layout Frameworks) */
        .user,
        .computer {
            flex: 1;
            min-width: 320px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        /* Identity Card Labels */
        h2 {
            font-size: 1.75rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.5px;
            color: var(--text-white);
            padding-bottom: 8px;
        }

        /* Horizontal Button Block grouping inside the User Board */
        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        /* Game Action Elements Styles */
        .user button {
            flex: 1;
            background-color: #1e293b;
            color: var(--text-white);
            border: 1px solid var(--border-color);
            padding: 14px 8px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: capitalize;
        }

        .user button:hover {
            background-color: var(--accent-glow);
            border-color: var(--accent-glow);
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }

        .user button:active {
            transform: translateY(-1px);
        }

        /* High Fidelity Structured Display Card Container Boxes */
        .display-card {
            width: 100%;
            background-color: var(--card-inner);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-slate);
        }

        /* Specific Targets Mapping To Your Exact IDs Without Any Class Swaps */
        #userPointsDisplay,
        #computerPointsDisplay {
            font-size: 2.2rem;
            font-weight: 800;
            color: #60a5fa;
            line-height: 1;
            margin-top: 4px;
        }

        #userChoiceDisplay,
        #computerChoiceDispaly {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-white);
            min-height: 32px;
        }

        /* Game System Global Reset Mechanism */
        #restartBtn {
            width: 100%;
            max-width: 340px;
            background-color: #1e293b;
            color: var(--text-white);
            border: 1px solid var(--border-color);
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.2s ease;
        }

        #restartBtn:hover {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3);
        }

        #restartBtn:active {
            transform: scale(0.98);
        }

        /* Mobile Screen Form Factor Adjustments */
        @media (max-width: 680px) {
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <!-- Main game container wrapper -->
    <main>
        <!-- Modern Page Title -->
        <h1 class="game-heading">Rock Paper Scissors</h1>

        <!-- User Zone -->
        <div class="user">
            <h2>User</h2>

            <!-- Move buttons to a neat grid row -->
            <div class="button-group">
                <button id="rockBtn">🪨 Rock</button>
                <button id="paperBtn">📄 paper</button>
                <button id="scissorBtn">✂️ Scissor</button>
            </div>

            <!-- Enhanced Display Box for Points -->
            <div class="display-card">
                <span class="card-label">Current Points</span>
                <div id="userPointsDisplay">0</div>
            </div>

            <!-- Enhanced Display Box for Choices -->
            <div class="display-card">
                <span class="card-label">Your Action</span>
                <div id="userChoiceDisplay">-</div>
            </div>
        </div>

        <!-- Computer Zone -->
        <div class="computer">
            <h2>Computer</h2>

            <!-- Enhanced Display Box for Points -->
            <div class="display-card">
                <span class="card-label">Current Points</span>
                <div id="computerPointsDisplay">0</div>
            </div>

            <!-- Enhanced Display Box for Choices -->
            <div class="display-card">
                <span class="card-label">Computer Action</span>
                <div id="computerChoiceDispaly">-</div>
            </div>
        </div>

        <!-- System Reset Control -->
        <button id="restartBtn">🔄 Restart Match</button>
    </main>
    <script src="script.js"></script>
</body>

</html>
