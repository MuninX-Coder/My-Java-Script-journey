<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Web Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Display Area Container -->
    <div class="displayAreaContainer">
       <input type="text" id="display" placeholder="0">
    </div>

    <!-- Buttons Container -->
    <div class="buttonsContainer">
        <!-- Special Buttons -->
        <button class="btn" id="clearBtn">C</button>
        <button class="btn" id="enterBtn">Enter</button>
        
        <!-- Operators -->
        <button class="btn" id="divisionBtn">/</button>
        <button class="btn" id="multiplyBtn">*</button>
        <button class="btn" id="subtractionBtn">-</button>
        <button class="btn" id="additionBtn">+</button>
        <button class="btn" id="dotBtn">.</button>

        <!-- Numbers -->
        <button class="btn" id="oneBtn">1</button>
        <button class="btn" id="twoBtn">2</button>
        <button class="btn" id="threeBtn">3</button>
        <button class="btn" id="fourBtn">4</button>
        <button class="btn" id="fiveBtn">5</button>
        <button class="btn" id="sixBtn">6</button>
        <button class="btn" id="sevenBtn">7</button>
        <button class="btn" id="eightBtn">8</button>
        <button class="btn" id="nineBtn">9</button>
        <button class="btn" id="zeroBtn">0</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
