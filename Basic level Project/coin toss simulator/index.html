<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Toss Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Toss your Coin</h1>
        <div id="displayResult"></div>
        <button id="coinTossBtn">Toss Coin</button>

        <ul class="statisticsList">
            <li>Head : <span id="headDisplay"></span></li>
            <li>Tail : <span id="tailDisplay"></span></li>
            <li>Head win % : <span id="headWinPercentage"></span></li>
            
            <li>Tail win % : <span id="tailWinPercentage"></span></li>
            <li>Total : <span id="totalDisplay"></span></li>
        </ul>

    </main>
    <script src="script.js"></script>
</body>

</html>
