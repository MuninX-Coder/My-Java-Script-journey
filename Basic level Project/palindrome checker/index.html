<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <style>
        /* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", sans-serif;
    background: #f4f7fc;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #333;
}

.main {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    text-align: center;
}

h1 {
    margin-bottom: 25px;
    color: #2563eb;
    font-size: 2rem;
}

.input-area {
    margin-bottom: 20px;
}

#input {
    width: 100%;
    padding: 14px;
    border: 2px solid #dbeafe;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    transition: 0.3s;
}

#input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
}

#resultBtn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

#resultBtn:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
}

#display {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    background: #eff6ff;
    color: #1e40af;
    font-weight: 600;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
}
    </style>
</head>
<body>
    <div class="main">
        <h1>Palindrome checker</h1>
        <div class="input-area">
            <input type="text" id="input" placeholder="enter your text">
        </div>
        <button id="resultBtn">Check Result</button>
        <div>
            <div id="display"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
