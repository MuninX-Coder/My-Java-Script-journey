<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array statistics Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <input type="text" placeholder="enter numbers using ',' " id="inputNum">

        <button id="resultBtn">Show Result</button>
        <div class="displayArea">
            <div>Sum: <span id="sumDisplay"></span></div>
            <div>Average: <span id="averageDisplay"></span></div>
            <div>Min: <span id="minDisplay"></span></div>
            <div>Max: <span id="maxDisplay"></span></div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
