<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character frequency analyser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Character frequency analyser</h1>
        <div class="inputContainer">
            <input type="text" placeholder="enter your text" id="inputTxt">
        </div>
        <button id="clickBtn">Analyze Text</button>
        <div class="display">
            <div class="characterFrequencyDiv">Character frequency: <span id="characterFrequency"></span></div>
            <div class="frequentCharacterDiv">Frequent Character: <span id="frequentCharacter"></span></div>
            <div class="repeatedCharacterDiv">Repeated Character: <span id="repeatedCharacter"></span>     </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
