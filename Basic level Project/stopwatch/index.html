<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <style>
           /* 1. Global Reset & Background Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Sleek Dark Slate Slate Color */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f8fafc;
        }

        /* 2. Container Card Styling */
        main {
            background: rgba(30, 41, 59, 0.7); /* Translucent glass effect */
            backdrop-filter: blur(12px);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 3. Display Area (Monospace font use kiya taaki numbers hile na counter chalte waqt) */
        #displayArea {
            font-family: 'JetBrains Mono', monospace;
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 2rem;
            letter-spacing: -1px;
            color: #38bdf8; /* Aesthetic Cyan Blue Glow */
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        /* 4. Common Button Styling */
        button {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.8rem 1.5rem;
            margin: 0 0.4rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        /* 5. Individual Button Colors (Modern Pastel/Muted Tones) */
        #startBtn {
            background-color: #10b981; /* Emerald Green */
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        #startBtn:hover {
            background-color: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
        }

        #stopBtn {
            background-color: #ef4444; /* Rose Red */
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        #stopBtn:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.3);
        }

        #resetBtn {
            background-color: #475569; /* Slate Gray */
            color: #cbd5e1;
        }

        #resetBtn:hover {
            background-color: #334155;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Active click effect for all buttons */
        button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <main>
        <div id="displayArea">0</div>
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
        <button id="resetBtn">Reset</button>

    </main>
    <script src="script.js"></script>
</body>
</html>
