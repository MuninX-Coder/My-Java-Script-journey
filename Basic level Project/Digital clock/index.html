<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        /* 1. Resetting basic padding-margin and setting a premium font */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

/* 2. Premium & Soft Dark Gradient Background */
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
    overflow: hidden;
}

/* 3. Main container centered layout */
main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
}

/* 4. Glassmorphism Display Card - Clean and Aesthetic */
.displayArea {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 3rem 4rem;
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

/* 5. Modern Bold Typography for Time */
#timeDisplay {
    font-size: 5rem;
    font-weight: 800;
    color: #f8fafc;
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 0.75rem;
    
    /* Subtle gradient finish on the time text */
    background: linear-gradient(to right, #ffffff, #cbd5e1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* 6. Muted Aesthetic Look for Date */
#dateDisplay {
    font-size: 1.15rem;
    font-weight: 400;
    color: #94a3b8;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* 7. Minimalist No-Border Button */
#formatBtn {
    background: rgba(255, 255, 255, 0.08);
    color: #f1f5f9;
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 0.8rem 1.8rem;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Hover effects that don't feel cheap */
#formatBtn:hover {
    background: #ffffff;
    color: #0f172a;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px -5px rgba(255, 255, 255, 0.1);
}

#formatBtn:active {
    transform: translateY(0);
}
    </style>
</head>
<body>
    <main>
        <div class="displayArea">
            <div id="timeDisplay">00-00-00</div>
            <div id="dateDisplay">00</div>
        </div>
        <button id="formatBtn">12/24 Format time</button>
    </main>
    <script src="script.js"></script>
</body>
</html>
