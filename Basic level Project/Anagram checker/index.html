<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anagram Checker</title>
    <style>
       * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body { 
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    font-family: system-ui, sans-serif;
    color: white;
    padding: 20px;
}

main {
    width: 100%;
    max-width: 450px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 2rem;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
}

h1 {
    margin-bottom: 1.5rem;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 1px;
}

.input {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 1.5rem;
}

input {
    width: 100%;
    padding: 14px 16px;
    border: none;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.08);
    color: white;
    font-size: 1rem;
    outline: none;
    transition: all 0.3s ease;
}

input::placeholder {
    color: rgba(255, 255, 255, 0.6);
}

input:focus {
    background: rgba(255, 255, 255, 0.12);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4);
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(99, 102, 241, 0.35);
}

button:active {
    transform: translateY(0);
}

#display {
    margin-top: 1.5rem;
    padding: 1rem;
    border-radius: 12px;
    min-height: 60px;
    background: rgba(255, 255, 255, 0.05);
    font-size: 1.1rem;
    font-weight: 500;
}
    </style>
</head>

<body>
    <main>
        <h1>Anagram Checker</h1>
        <div class="input">
            <input type="text" id="input-1" placeholder="enter word 1">
            <input type="text" id="input-2" placeholder="enter word 2">

        </div>
        <button id="resultbtn">Check Result</button>
        <div id="display"></div>

        <script src="script.js"></script>
    </main>
</body>

</html>
